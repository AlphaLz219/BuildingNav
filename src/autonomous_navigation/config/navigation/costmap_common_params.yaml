# ============================================================
# 代价地图共享参数（global_costmap 与 local_costmap 共用）
# 适配：SLAM Toolbox 2D 建图 + Livox Mid-360（0.4m 安装高度）
#
# 注意：使用 plugin 架构时，各插件的参数必须放在对应插件命名空间下，
#       顶层参数不会被插件读取（costmap_2d 不会回退到父命名空间）。
# ============================================================

# 机器人外接圆半径（TB3 Burger 底盘 ~0.105m），用于碰撞检测
robot_radius: 0.055

# 顶层参数作为 obstacle_layer 回退读取的默认值
obstacle_range: 5.0
raytrace_range: 6.0

# ---- 静态层（仅全局代价地图使用，从 /map 读取 SLAM Toolbox 地图） ----
static_layer:
  # 静态地图话题（SLAM Toolbox 发布的栅格地图）
  map_topic: /map
  # 是否订阅地图增量更新（SLAM 建图过程中会发布 /map_updates）
  subscribe_to_updates: true
  # 是否跟踪未知空间（未知区域不当作自由空间，规划时更保守）
  track_unknown_space: false
  # 地图上代价 >= 此值的栅格视为致命障碍（costmap_2d 默认 100）
  lethal_cost_threshold: 100
  # 未知区域的代价（-1 表示使用 costmap_2d 默认的 unknown 值）
  unknown_cost_value: -1
  # 三态代价地图（true：栅格仅为自由/致命/未知，false：保留地图原始 0-100 代价）
  trinary_costmap: true
  # 是否使用地图中的最大代价覆盖膨胀层（多用于 VFH，导航中保持 false）
  use_maximum: false

# ---- 障碍层
obstacle_layer:
  observation_sources: scan_2d
  # 障碍物检测最大距离（m）
  obstacle_range: 5.0
  # 光线追踪清除距离（m）
  raytrace_range: 6.0

  scan_2d:
    # 数据类型：LaserScan（2D 激光扫描，由 pointcloud_to_laserscan 生成）
    data_type: LaserScan
    # 话题名称
    topic: /scan_2d
    # 传感器模型：ray（射线模型，支持光线追踪清除）
    sensor_model_type: ray
    # 是否用此传感器清除障碍物（激光经过的自由空间标记为可通行）
    clearing: true
    # 是否用此传感器标记障碍物
    marking: true
    # 该传感器的光线追踪清除范围（m）
    raytrace_range: 6.0
    # 该传感器的障碍物标记范围（m）
    obstacle_range: 5.0
    # 障碍物高度上限（m），高于此值的点忽略
    # 传感器安装高度 0.4m，2D 扫描为水平面，端点 z ≈ 0.4m，必须 > 0.4
    max_obstacle_height: 0.6
    # 障碍物高度下限（m），低于此值的点忽略
    min_obstacle_height: -0.1
    # 允许 inf（无穷远）读数作为有效数据（表示未检测到障碍物的射线）
    inf_is_valid: true
    # 观测数据保留时间（s），0 = 每次更新后立即丢弃旧观测，防止残留障碍物
    observation_persistence: 0.0

# ---- 膨胀层（必须在 inflation_layer 命名空间下） ----
inflation_layer:
  # 膨胀半径（m），障碍物周围的安全缓冲区域
  inflation_radius: 0.1
  # 膨胀衰减系数
  cost_scaling_factor: 10.0
