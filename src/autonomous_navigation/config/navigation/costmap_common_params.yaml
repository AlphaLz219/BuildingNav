# ============================================================
# 代价地图共享参数（global_costmap 与 local_costmap 共用）
# 适配：SLAM Toolbox 2D 建图 + Livox Mid-360（0.4m 安装高度）
#
# 注意：使用 plugin 架构时，各插件的参数必须放在对应插件命名空间下，
#       顶层参数不会被插件读取（costmap_2d 不会回退到父命名空间）。
# ============================================================

# 机器人外接圆半径（TB3 Burger 底盘 ~0.105m），用于碰撞检测
robot_radius: 0.105

# 顶层参数作为 obstacle_layer 回退读取的默认值
obstacle_range: 5.0
raytrace_range: 6.0

# ---- 障碍层（必须在 obstacle_layer 命名空间下） ----
obstacle_layer:
  observation_sources: scan_2d
  # 障碍物检测最大距离（m）
  obstacle_range: 5.0
  # 光线追踪清除距离（m）
  raytrace_range: 6.0

  scan_2d:
    # 数据类型：LaserScan（2D 激光扫描，由 pointcloud_to_laserscan 生成）
    data_type: LaserScan
    # 话题名称
    topic: /scan_2d
    # 传感器模型：ray（射线模型，支持光线追踪清除）
    sensor_model_type: ray
    # 是否用此传感器清除障碍物（激光经过的自由空间标记为可通行）
    clearing: true
    # 是否用此传感器标记障碍物
    marking: true
    # 该传感器的光线追踪清除范围（m）
    raytrace_range: 6.0
    # 该传感器的障碍物标记范围（m）
    obstacle_range: 5.0
    # 障碍物高度上限（m），高于此值的点忽略
    # 传感器安装高度 0.4m，2D 扫描为水平面，端点 z ≈ 0.4m，必须 > 0.4
    max_obstacle_height: 0.6
    # 障碍物高度下限（m），低于此值的点忽略
    min_obstacle_height: -0.1
    # 允许 inf（无穷远）读数作为有效数据（表示未检测到障碍物的射线）
    inf_is_valid: true
    # 观测数据保留时间（s），0 = 每次更新后立即丢弃旧观测，防止残留障碍物
    observation_persistence: 0.0

# ---- 膨胀层（必须在 inflation_layer 命名空间下） ----
inflation_layer:
  # 膨胀半径（m），障碍物周围的安全缓冲区域
  inflation_radius: 0.1
  # 膨胀衰减系数
  cost_scaling_factor: 10.0
