# Navigation Parameters for TurtleBot3
# Compatible with explore_lite and move_base

# Global costmap parameters
global_costmap:
  global_frame: "map"
  robot_base_frame: "base_footprint"
  update_frequency: 5.0
  publish_frequency: 2.0
  static_map: false               # Will be set by SLAM
  rolling_window: false
  width: 100.0
  height: 100.0
  resolution: 0.05
  origin_x: -50.0
  origin_y: -50.0
  
  inflation_radius: 0.55
  cost_scaling_factor: 10.0
  
  observation_sources: "scan"
  scan:
    data_type: "PointCloud2"
    topic: "/scan"
    marking: true
    clearing: true
    min_obstacle_height: 0.0
    max_obstacle_height: 2.0
    obstacle_range: 5.0
    raytrace_range: 6.0

# Local costmap parameters  
local_costmap:
  global_frame: "odom"
  robot_base_frame: "base_footprint"
  update_frequency: 10.0
  publish_frequency: 5.0
  static_map: false
  rolling_window: true
  width: 4.0
  height: 4.0
  resolution: 0.05
  
  inflation_radius: 0.55
  cost_scaling_factor: 10.0
  
  observation_sources: "scan"
  scan:
    data_type: "PointCloud2"
    topic: "/scan"
    marking: true
    clearing: true
    min_obstacle_height: 0.0
    max_obstacle_height: 2.0
    obstacle_range: 5.0
    raytrace_range: 6.0

# DWA Local Planner parameters
DWAPlannerROS:
  # Robot configuration
  max_vel_x: 0.5
  min_vel_x: 0.0
  max_vel_y: 0.0                  # Differential drive, no lateral movement
  min_vel_y: 0.0
  max_trans_vel: 0.5
  min_trans_vel: 0.1
  max_rot_vel: 1.0
  min_rot_vel: 0.2
  
  # Acceleration limits
  acc_lim_x: 1.0
  acc_lim_y: 0.0
  acc_lim_theta: 1.5
  
  # Goal tolerance
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.1
  latch_xy_goal_tolerance: false
  
  # Sampling parameters
  sim_time: 2.0
  sim_granularity: 0.025
  angular_sim_granularity: 0.025
  vx_samples: 20
  vy_samples: 0
  vtheta_samples: 40
  
  # Trajectory scoring
  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.01
  forward_point_distance: 0.325
  stop_time_buffer: 0.2
  scaling_speed: 0.25
  max_scaling_factor: 0.2
  
  # Oscillation prevention
  oscillation_reset_dist: 0.05
  
  # Debugging
  publish_traj_pc: true
  publish_cost_grid_pc: true

# Base local planner fallback
base_local_planner_params:
  max_vel_x: 0.5
  min_vel_x: 0.1
  max_rot_vel: 1.0
  min_rot_vel: 0.2
  acc_lim_x: 1.0
  acc_lim_theta: 1.5
  xy_goal_tolerance: 0.15
  yaw_goal_tolerance: 0.1
  sim_time: 2.0
  sim_granularity: 0.025
  vx_samples: 20
  vtheta_samples: 40
  path_distance_bias: 32.0
  goal_distance_bias: 24.0
  occdist_scale: 0.01

# Recovery behaviors
recovery_behaviors:
  - name: 'conservative_reset'
    type: 'clear_costmap_recovery/ClearCostmapRecovery'
  - name: 'rotate_recovery'
    type: 'rotate_recovery/RotateRecovery'
  - name: 'aggressive_reset'
    type: 'clear_costmap_recovery/ClearCostmapRecovery'

conservative_reset:
  reset_distance: 3.0
  layer_names: ["obstacles", "inflation"]
  
aggressive_reset:
  reset_distance: 1.5
  layer_names: ["obstacles", "inflation"]

# AMCL parameters (for localization after map is built)
amcl:
  min_particles: 500
  max_particles: 2000
  kld_err: 0.01
  kld_z: 0.99
  update_min_d: 0.2
  update_min_a: 0.2
  resample_interval: 1
  transform_tolerance: 0.5
  recovery_alpha_slow: 0.0
  recovery_alpha_fast: 0.0
  initial_pose_x: 0.0
  initial_pose_y: 0.0
  initial_pose_a: 0.0
  gui_publish_rate: 10.0
  laser_max_range: 30.0
  laser_max_beams: 180
  laser_z_hit: 0.95
  laser_z_short: 0.1
  laser_z_max: 0.05
  laser_z_rand: 0.05
  laser_sigma_hit: 0.2
  laser_lambda_short: 0.1
  laser_model_type: "likelihood_field"
  laser_likelihood_max_dist: 2.0
  odom_model_type: "diff"
  odom_alpha1: 0.1
  odom_alpha2: 0.1
  odom_alpha3: 0.1
  odom_alpha4: 0.1
  odom_frame_id: "odom"
  base_frame_id: "base_footprint"
  global_frame_id: "map"
