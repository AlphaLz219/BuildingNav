# TurtleBot3 Wheeled Robot Configuration
# Aligned with Unitree A1 dog sensor configuration

robot:
  name: "turtlebot3_waffle_pi"
  type: "differential_drive"
  
# Physical parameters
dimensions:
  length: 0.266  # meters
  width: 0.266   # meters
  height: 0.094  # meters
  wheel_radius: 0.033
  wheel_separation: 0.287

# Velocity limits
velocity_limits:
  max_linear_velocity: 0.5   # m/s
  max_angular_velocity: 1.0  # rad/s
  max_linear_acceleration: 0.5
  max_angular_acceleration: 1.0

# Sensor configuration - aligned with Unitree A1
sensors:
  lidar:
    type: "livox_mid360"
    frame_id: "laser_livox"
    topic: "/scan"
    pointcloud_topic: "/scan"  # PointCloud2 output
    pose:
      x: 0.2
      y: 0.0
      z: 0.08
      roll: 0.0
      pitch: 0.785  # 45 degrees tilt, same as dog
      yaw: 0.0
    range:
      min: 0.1
      max: 40.0
    update_rate: 10  # Hz
    
  imu:
    type: "generic_imu"
    frame_id: "imu_link"
    topic: "/trunk_imu"  # Same topic name as dog
    update_rate: 1000  # Hz
    noise_stddev: 0.001
    
  odom:
    topic: "/odom"
    frame_id: "odom"
    child_frame_id: "base_footprint"
    update_rate: 100  # Hz

# TF frames
tf_frames:
  base_frame: "base_footprint"
  base_link: "base_link"
  odom_frame: "odom"
  map_frame: "map"
  lidar_frame: "laser_livox"
  imu_frame: "imu_link"

# Control settings
control:
  command_topic: "/cmd_vel"  # Same as dog's RL mode
  controller_type: "differential_drive"
  publish_tf: true
  publish_odom_tf: true

# Gazebo simulation settings
gazebo:
  real_time_update_rate: 1000
  max_step_size: 0.001
