# ============================================================
# 前沿探索参数配置
# ============================================================

# ---- 前沿检测 ----
# 前沿簇最小像素数，低于此值的簇视为噪声忽略
# 值越大 → 过滤越多，只选大前沿（探索快但可能遗漏小区域）
# 值越小 → 保留更多小前沿（探索细但目标多、效率低）
min_frontier_size: 20

# 前沿检测频率（Hz），不需要太高，SLAM Toolbox 地图更新约 0.5Hz
detection_frequency: 0.5

# ---- 目标评分 ----
# 前沿大小权重（信息增益），越大 → 优先选大前沿
score_size_weight: 0.6
# 距离权重（越近越好），越大 → 优先选近处前沿（减少行驶距离）
score_distance_weight: 0.4
# 安全净空权重（距障碍物多远），越大 → 优先选宽敞安全的目标
# 三个权重自动归一化，和恒为 1.0
score_clearance_weight: 0.3

# ---- 目标安全过滤 ----
# 目标点距最近障碍物的最小净空（米），低于此值的前沿簇直接跳过
# 配合距离变换使用，确保目标不在墙壁/未知区域边缘
min_goal_clearance: 0.3

# 梯度推进最大步数，从簇内最深点沿距离梯度向内走
# 每一步 = 1 个栅格 (0.05m)，20 步 = 最多推进 1m
# 到达局部最大值（通道/房间中心）后自动停止，不会走满
# 设为 0 关闭梯度推进
max_push_steps: 20

# ---- 导航预检 ----
# make_plan 预检查超时（秒），超时视为不可达
plan_check_timeout: 2.0

# ---- 探索终止 ----
# 连续无前沿检测次数，超过后判定探索完成
# 设太小可能在短暂无前沿时误判为完成
max_no_frontier_count: 5

# ---- 导航控制 ----
# 单次导航超时（秒），超过则取消目标并尝试下一个前沿
navigation_timeout: 120.0

# 建图期周期性重规划间隔（秒）
# 导航进行中每隔此时间取消并重发同一目标，强制 move_base
# 基于最新 global_costmap 重新调用全局规划器。
# 解决 SLAM 地图持续扩展时机器人死守旧路径、无视新捷径的问题。
# 设为 0 或负数关闭此功能；过小（<3s）可能造成 cmd_vel 抖动
replan_interval: 6.0

# 距目标小于此距离时停止重规划（米），避免接近目标时反复取消导致振荡
replan_min_distance: 3.5

# 黑名单半径（米），导航失败的目标周围此范围内不再重复尝试
blacklist_radius: 1.5

# 距机器人太近的前沿不选（米），已在附近无需导航
min_goal_distance: 0.8
