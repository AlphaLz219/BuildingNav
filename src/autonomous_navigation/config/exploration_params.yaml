# ============================================================
# 前沿探索参数配置
# ============================================================

# ---- 前沿检测 ----
# 前沿簇最小像素数，低于此值的簇视为噪声忽略
# 值越大 → 过滤越多，只选大前沿（探索快但可能遗漏小区域）
# 值越小 → 保留更多小前沿（探索细但目标多、效率低）
min_frontier_size: 20

# 前沿检测频率（Hz），不需要太高，hector_mapping 地图更新约 0.5Hz
detection_frequency: 0.5

# ---- 目标评分（比值法: Score = Gain / (Cost + epsilon)）----
# 计算 Gain 时，以簇目标点为中心膨胀的半径（栅格数）
# 该圆内未知像素占比即为 Gain（0~1）
# 半径太小只看局部容易被噪声干扰，太大则和远处前沿的区分度降低
# 15 栅格 × 0.05m = 0.75m 半径
gain_unknown_radius: 15

# 方向惩罚系数 λ，掉头（180°）时 Cost 增加此比例
# 例：0.4 表示掉头 Cost×1.4，侧方（90°）Cost×1.2
# 值越大机器人越不愿掉头，值太小则方向约束弱
direction_penalty: 0.4

# 分母常数（米），Cost 不会低于此值，防止近距离前沿得分爆炸
# 0.5m 意味着即使前沿就在脚下，Score 也不会超过 Gain/0.5
cost_epsilon: 0.5

# Cost 使用 make_plan 返回的真实路径长度（true）还是欧氏距离（false）
# true 更准确（考虑绕墙），但对每个候选都要调服务；false 更快
use_path_length: true

# ---- 目标安全过滤 ----
# 目标点距最近障碍物的最小净空（米），低于此值的前沿簇直接跳过
# 配合距离变换使用，确保目标不在墙壁/未知区域边缘
min_goal_clearance: 0.3

# 梯度推进最大步数，从簇内最深点沿距离梯度向内走
# 每一步 = 1 个栅格 (0.05m)，20 步 = 最多推进 1m
# 到达局部最大值（通道/房间中心）后自动停止，不会走满
# 设为 0 关闭梯度推进
max_push_steps: 20

# ---- 导航预检 ----
# make_plan 预检查超时（秒），超时视为不可达
plan_check_timeout: 2.0

# ---- 探索终止 ----
# 连续无前沿检测次数，超过后判定探索完成
# 设太小可能在短暂无前沿时误判为完成
max_no_frontier_count: 5

# ---- 导航控制 ----
# 单次导航超时（秒），超过则取消目标并尝试下一个前沿
navigation_timeout: 120.0

# 建图期周期性重规划间隔（秒）
# 导航进行中每隔此时间取消并重发同一目标，强制 move_base
# 基于最新 global_costmap 重新调用全局规划器。
# 解决地图持续扩展时机器人死守旧路径、无视新捷径的问题。
# 设为 0 或负数关闭此功能；过小（<3s）可能造成 cmd_vel 抖动
replan_interval: 0.0

# 距目标小于此距离时停止重规划（米），避免接近目标时反复取消导致振荡
replan_min_distance: 4.5

# ---- 目标过时检测 ----
# Gain 衰减阈值，当前 Gain 低于出发时 Gain × 此比例即判定目标过时
# 例：0.3 表示目标区域 70% 的未知空间已被观测到则放弃该目标
# 值太低容易误判（大房间入口场景），值太高则反应迟钝
gain_decay_threshold: 0.3

# 距目标小于此距离（米）时才开始检查过时，避免远距离回环误判
# 约等于激光雷达在建筑内的有效观测半径
stale_check_distance: 3.0

# 过时检查间隔（秒）
# 2s 意味着机器人接近目标后每 2 秒评估一次 Gain 衰减
stale_check_interval: 2.0

# 黑名单半径（米），导航失败的目标周围此范围内不再重复尝试
blacklist_radius: 1.5

# 距机器人太近的前沿不选（米），已在附近无需导航
min_goal_distance: 0.8
