# ============================================================
# 局部规划器参数（dwa_local_planner/DWAPlannerROS）
# 适配：Unitree A1 机器狗，junior_ctrl move_base 模式
# 参考：unitree_guide/unitree_move_base/config/base_local_planner_params.yaml
# ============================================================

recovery_behavior_enabled: true
clearing_rotation_allowed: true

controller_frequency: 10.0

DWAPlannerROS:
  # ---- 速度限制（官方参数）----
  max_vel_x: 0.5
  min_vel_x: 0.3
  max_vel_y: 0.0
  min_vel_y: 0.0
  max_vel_theta: 2.2
  min_vel_theta: -2.2
  min_in_place_vel_theta: 0.8
  escape_vel: -0.3

  # ---- 加速度限制（官方参数）----
  acc_lim_x: 2.5
  acc_lim_y: 0.5
  acc_lim_theta: 0.8

  # ---- 仿真参数 ----
  # 前向仿真时间（s），越长 DWA 评估越远，敢选更高速度
  sim_time: 2.5
  # 线速度采样数量（越多速度选择越精细）
  vx_samples: 20
  # 横向速度采样数量
  vy_samples: 1
  # 角速度采样数量
  vtheta_samples: 20
  # 仿真步长（s），轨迹离散化精度
  sim_granularity: 0.025

  # ---- 评价函数权重 ----
  # score = path_distance_bias × path_dist + goal_distance_bias × goal_dist 
  #                                        + occdist_scale × obstacle_cost
  # 路径跟随权重，适度跟随全局路径
  path_distance_bias: 1.4
  # 目标趋近权重，更积极地朝目标移动（穿窄道时更有效）
  goal_distance_bias: 2.8
  # 障碍物距离权重，适度远离障碍物
  occdist_scale: 0.01
  # 旋转抑制权重，惩罚无意义的原地旋转
  # twirling_scale: 0.5
  # 停车判定阈值（m），距目标小于此值时开始减速停车
  stop_threshold: 0.1

  # ---- 振荡检测 ----
  # 振荡重置距离（m），移动超过此距离后重置振荡计时器
  oscillation_reset_dist: 0.05
  # 振荡重置角度（rad），旋转超过此角度后重置振荡计时器
  oscillation_reset_angle: 0.2

  # ---- 其他 ----
  # 前向参考点距离（m），用于评估轨迹是否朝向前方
  forward_point_distance: 0.2
  # 位置容忍度（m），到达目标 ±此距离即认为到位
  xy_goal_tolerance: 0.6

  # 朝向容忍度（rad），到达目标朝向 ±此角度即认为到位
  # 0.2 rad ≈ 11.5°，对真实机器人来说合理
  yaw_goal_tolerance: 0.5

  # 【关键】先锁位置再调朝向，避免位姿互扰
  # true = 到达 xy 容忍度后，固定位置只旋转调朝向
  latch_xy_goal_tolerance: true

  # 原地旋转的最小角速度（rad/s），用于最后精细调姿
  # 太低则无力克服摩擦力，太高则容易 overshoot
  min_in_place_vel_theta: 0.3

  # 裁剪已走过的全局路径段，减少规划器计算量
  prune_plan: true